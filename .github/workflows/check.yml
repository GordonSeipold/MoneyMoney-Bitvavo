name: Check

# Runs the same verification as the release workflow, but on every change
# rather than only at tag time, so a broken script is caught when it is
# written instead of when it ships.
#
# Security notes:
#   - No untrusted event payload (issue/PR/comment text, branch names) is
#     referenced in any run: step, so there is no script-injection surface.
#   - The trigger is pull_request, never pull_request_target: a fork's code
#     runs with a read-only token and no access to repository secrets.
#   - permissions is contents: read. This workflow never writes.
#   - tools/check.sh is executed from the pull request's own branch, so a
#     fork can change what runs. That is acceptable only because the token
#     is read-only and no secrets are exposed; GitHub additionally holds
#     first-time contributors for manual approval.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Verify
        run: ./tools/check.sh
