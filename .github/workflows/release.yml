name: Release

# Triggered only by a maintainer pushing a version tag. No untrusted event
# payload (issue/PR/comment text) is read anywhere in this workflow, so there
# is no script-injection surface in the run: steps below.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Verify
        run: ./tools/check.sh

      - name: Check whether the release is signed
        run: |
          if grep -q '^-- SIGNATURE:' *.lua; then
            echo "This release is signed."
          else
            echo "::warning::This release is unsigned. Users must disable signature verification in MoneyMoney."
          fi

      # The convention is that a release says what it was tested against. Reading it from the
      # source rather than typing it into the release means it cannot be forgotten and cannot
      # drift from what the file itself claims. The value comes from the repository, not from
      # an event payload, so it is maintainer-controlled like the rest of the checkout.
      - name: Read the tested-with line from the source
        id: tested
        run: |
          line=$(grep -m1 '^-- Tested with:' *.lua | sed 's/^-- //')
          echo "line=$line" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.lua'
          generate_release_notes: true
          body: |
            ${{ steps.tested.outputs.line }}
